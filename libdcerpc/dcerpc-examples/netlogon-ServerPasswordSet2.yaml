# Replaces the machine-account password. ClearNewPassword is an
# NL_TRUST_PASSWORD encrypted with the session key; this fixed buffer
# is not, and the PDU is not signed, so the DC refuses it with
# STATUS_ACCESS_DENIED (3221225506).
ServerPasswordSet2: Request
  PrimaryName: \\ad-adc
  AccountName: NLTEST1$
  SecureChannelType: WorkstationSecureChannel
  ComputerName: NLTEST1
  Authenticator: 
    Credential: 
      Data: 0102030405060708
    Timestamp: 1
  ClearNewPassword: 
    Buffer: 
    Length: 8
