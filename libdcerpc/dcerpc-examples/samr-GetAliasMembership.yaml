# The Builtin aliases (S-1-5-32) that the account domain's
# Administrator (500) and None/Domain Users (513) are members of.
# The account domain is the first one EnumerateDomainsInSamServer
# returns; LookupDomainInSamServer gives its SID for OpenDomain.
Connect5: Request
  ServerName: \\10.10.10.11
  DesiredAccess: SAM_SERVER_CONNECT | SAM_SERVER_ENUMERATE_DOMAINS | SAM_SERVER_LOOKUP_DOMAIN
  InVersion: 1
  InRevisionInfo:
    V1:
      Revision: 3
      SupportedFeatures: 0
---
EnumerateDomainsInSamServer: Request
  ServerHandle:
    ContextHandleAttributes: 0
    UUID: @UUID:-1@
  EnumerationContext: 0
  PreferedMaximumLength: 65536
---
LookupDomainInSamServer: Request
  ServerHandle:
    ContextHandleAttributes: 0
    UUID: @UUID:-2@
  Name: @Name@
---
OpenDomain: Request
  ServerHandle:
    ContextHandleAttributes: 0
    UUID: @UUID:-3@
  DesiredAccess: DOMAIN_GET_ALIAS_MEMBERSHIP
  DomainId: S-1-5-32
---
GetAliasMembership: Request
  DomainHandle:
    ContextHandleAttributes: 0
    UUID: @UUID:-1@
  SidArray:
    Count: 2
    Sids:
      - @DomainId:-2@-500
      - @DomainId:-2@-513
---
CloseHandle: Request
  SamHandle:
    ContextHandleAttributes: 0
    UUID: @UUID:-2@
---
CloseHandle: Request
  SamHandle:
    ContextHandleAttributes: 0
    UUID: @UUID:-6@
